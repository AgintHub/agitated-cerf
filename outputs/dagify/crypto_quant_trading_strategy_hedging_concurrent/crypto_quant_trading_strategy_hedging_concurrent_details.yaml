          - '        ''correlation_coefficients'': [0.92, 0.88, 0.45],'
          - '        ''feature_names'': [''volume'', ''price'']'
          - '    }'
          - )
          output: "{\n  \"trending_coin_symbols\": [\"BTC\", \"ETH\"],\n  \"volume_scores\"\
            : [0.92, 0.88],\n  \"volume_thresholds\": [100.0, 130.0]\n}"
        - lines:
          - result = identify_volume_trends(
          - '    volume_data={'
          - '        ''normalized_volumes'': [200.0, 210.0],'
          - '        ''dates'': [''2024-01-01'', ''2024-01-02'']'
          - '    },'
          - '    analysis_results={'
          - '        ''correlation_coefficients'': [0.95, 0.93],'
          - '        ''feature_names'': [''volume'', ''price'']'
          - '    }'
          - )
          output: "{\n  \"trending_coin_symbols\": [\"BTC\"],\n  \"volume_scores\"\
            : [0.95],\n  \"volume_thresholds\": [190.0]\n}"
        parameters:
        - description: Output from preprocess_volume_data containing normalized volume
            series and related metadata.
          name: volume_data
          type: dict
        - description: Output from perform_statistical_analysis containing correlation
            coefficients, regression slopes, etc.
          name: analysis_results
          type: dict
        raises:
        - description: Raised when volume_data or analysis_results are missing required
            fields or contain inconsistent lengths.
          type: ValueError
        returns:
          description: 'Dictionary with keys:

            - trending_coin_symbols (List[str])

            - volume_scores (List[float])

            - volume_thresholds (List[float])'
