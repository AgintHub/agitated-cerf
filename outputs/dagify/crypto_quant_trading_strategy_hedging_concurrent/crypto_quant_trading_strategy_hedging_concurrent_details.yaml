        summary: Identify volume-activated trending coins based on preprocessed volume
          data and statistical analysis.
    prompt: Use preprocessed volume data and statistical analysis to identify high-volume
      trending coins.
  launch_strategy:
    agent: false
    description: Launch the validated trading strategy by allocating capital, setting
      entry/exit conditions, applying hedging ratios, defining cumulative loss limits,
      and specifying monitoring metrics.
    name: launch_strategy
    nodes_depended_on:
    - validate_strategy
    - hedge_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Initial capital allocated to the trading strategy expressed in
        USD.
      key: initial_capital
      type: float
    - description: Textual description of the criteria to enter a position.
      key: entry_condition
      type: str
    - description: Textual description of the criteria to exit a position.
      key: exit_condition
      type: str
    - description: Ratio of Tether (USDT) used for hedging relative to crypto exposure.
      key: hedging_ratio
      type: float
    - description: Maximum cumulative loss in USD allowed before the strategy is halted.
      key: risk_limit_cumulative_loss
      type: float
    - description: List of metrics that will be monitored during strategy execution
        (e.g., P&L, Sharpe Ratio, Drawdown).
      key: monitoring_metrics
      type: List[str]
    prd:
      conceptual_info: The launch_strategy node takes validated strategy metrics and
        hedging information to instantiate a live trading configuration. It determines
        how much capital to commit, when to enter and exit trades, how much Tether
        to allocate for hedging, sets a hard stop based on cumulative loss, and specifies
        performance indicators to track.
      docstring:
        examples:
        - lines:
          - config = launch_strategy(
          - '    is_valid=True,'
          - '    cagr=0.35,'
          - '    sharpe_ratio=2.1,'
          - '    max_drawdown=0.15,'
          - '    net_profit=120000.0,'
          - '    total_trades=240,'
          - '    hedging_ratio=0.25,'
          - '    entry_conditions=''BTC price rises 3% above 7-day SMA'','
          - '    exit_conditions=''BTC falls 2% below 7-day SMA'''
          output: '{''initial_capital'': 100000.0, ''entry_condition'': ''BTC price
            rises 3% above 7-day SMA'', ''exit_condition'': ''BTC falls 2% below 7-day
            SMA'', ''hedging_ratio'': 0.25, ''risk_limit_cumulative_loss'': 20000.0,
            ''monitoring_metrics'': [''P&L'', ''Sharpe Ratio'', ''Drawdown'']}'
        - lines:
          - launch_strategy(is_valid=False, cagr=0.0, sharpe_ratio=0.0, max_drawdown=0.0,
            net_profit=0.0, total_trades=0, hedging_ratio=0.0, entry_conditions='',
            exit_conditions='')
          output: 'ValueError: Strategy validation failed. Cannot launch strategy.'
        parameters:
        - description: Flag indicating whether the strategy passed validation.
          name: is_valid
          type: bool
        - description: Compound Annual Growth Rate of the validated strategy.
          name: cagr
          type: float
        - description: Risk-adjusted return metric of the strategy.
          name: sharpe_ratio
          type: float
        - description: Maximum drawdown observed during backtesting.
          name: max_drawdown
          type: float
        - description: Net profit after hedging, in USD.
          name: net_profit
          type: float
        - description: Number of trades executed during backtesting.
          name: total_trades
          type: int
        - description: Optimal ratio of Tether to crypto holdings determined by hedge_strategy.
          name: hedging_ratio
          type: float
        - description: Conditions under which the hedge should be initiated (from
            hedge_strategy).
          name: entry_conditions
          type: str
        - description: Conditions under which the hedge should be closed (from hedge_strategy).
          name: exit_conditions
          type: str
        raises:
        - description: Raised if the strategy is invalid (is_valid is False).
          type: ValueError
        returns:
          description: 'Dictionary containing configuration keys: initial_capital,
            entry_condition, exit_condition, hedging_ratio, risk_limit_cumulative_loss,
            monitoring_metrics.'
          type: dict
        summary: Instantiate a trading strategy configuration from validated metrics
          and hedging parameters.
    prompt: Based on the validated trading strategy, launch the trading strategy with
      an appropriate initial capital allocation. Ensure that the strategy is properly
      parameterized, risk-managed, and monitored for performance.
  perform_statistical_analysis:
    agent: false
    description: Conduct regression and correlation analyses on cleaned price and
      volume datasets, producing numerical metrics and descriptive summaries for downstream
      trend identification.
    name: perform_statistical_analysis
    nodes_depended_on:
    - preprocess_price_data
    - preprocess_volume_data
    nodes_dependent_on: []
    output_structure:
    - description: Names of the features used in the analysis
      key: feature_names
      type: List[str]
    - description: Pearson correlation coefficients between each pair of features
      key: correlation_coefficients
      type: List[float]
    - description: Slope coefficients from linear regressions for each feature against
        the target variable
      key: regression_slopes
      type: List[float]
    - description: Intercept terms from linear regressions for each feature
      key: regression_intercepts
      type: List[float]
    - description: Coefficient of determination (R^2) for each regression model
      key: regression_r2_scores
      type: List[float]
    - description: p-values for the slope coefficients in each regression model
      key: regression_p_values
      type: List[float]
    - description: Concise textual summary of the key statistical findings
      key: analysis_summary
      type: str
    prd:
      conceptual_info: This node performs statistical exploration on pre‑processed
        price and volume time series. It fits simple linear regressions of each feature
        against a chosen target (typically price) and calculates Pearson correlation
        coefficients, R² scores, and p‑values. The resulting metrics help downstream
        nodes (price/volume trend identification) to rank coins and set threshold
        scores.
      docstring:
        examples:
        - lines:
          - '# Mock preprocessed price data'
          - price_data = {
          - '    ''dates'': [''2024-01-01'', ''2024-01-02'', ''2024-01-03''],'
          - '    ''prices'': [100.0, 102.5, 101.0],'
          - '    ''missing_values_count'': 0,'
          - '    ''is_normalized'': True'
          - '}'
          - '# Mock preprocessed volume data'
          - volume_data = {
          - '    ''dates'': [''2024-01-01'', ''2024-01-02'', ''2024-01-03''],'
          - '    ''raw_volumes'': [5000, 5200, 5100],'
          - '    ''normalized_volumes'': [0.0, 0.2, 0.1],'
          - '    ''missing_value_count'': 0,'
          - '    ''is_valid'': True'
          - '}'
          output: '{feature_names: [prices, normalized_volumes], correlation_coefficients:
            [0.98], regression_slopes: [2.5, -0.5], regression_intercepts: [50.0,
            1.0], regression_r2_scores: [0.97, 0.9], regression_p_values: [0.001,
            0.05], analysis_summary: Strong positive correlation between price and
            volume; price increases with volume.}'
        - lines:
          - '# Using default target feature'
          - result = perform_statistical_analysis(price_data, volume_data)
          - print(result['analysis_summary'])
          output: '"Strong positive correlation between price and volume; price increases
            with volume."'
        parameters:
        - description: Dictionary returned by `preprocess_price_data`, containing
            keys `dates`, `prices`, `missing_values_count`, and `is_normalized`.
          name: price_data
          type: dict
        - description: Dictionary returned by `preprocess_volume_data`, containing
            keys `dates`, `raw_volumes`, `normalized_volumes`, `missing_value_count`,
            and `is_valid`.
          name: volume_data
          type: dict
        - description: 'Name of the feature to predict (default: `''prices''`). It
            must exist in `price_data`.'
          name: target_feature
          type: str
        raises:
        - description: If `price_data` or `volume_data` is missing required keys,
            or if `target_feature` is not present.
          type: ValueError
        - description: If regression or correlation calculation fails due to insufficient
            data.
          type: RuntimeError
        returns:
          description: A dictionary mapping the output field names to their computed
            values, matching the node's output_structure.
          type: dict
        summary: Perform regression and correlation analyses on cleaned price and
          volume datasets to extract statistical metrics for trend detection.
    prompt: Perform statistical analysis (e.g. regression, correlation) on the preprocessed
      price and volume data to identify trends and patterns.
  preprocess_price_data:
    agent: false
    description: Clean and transform price data for analysis by imputing missing values,
      normalizing price series, and scaling features.
    name: preprocess_price_data
    nodes_depended_on:
    - download_historical_prices
    nodes_dependent_on: []
    output_structure:
    - description: List of dates corresponding to the price series in ISO format (YYYY-MM-DD).
      key: dates
      type: List[str]
    - description: List of processed price values aligned with the dates list.
      key: prices
      type: List[float]
    - description: Number of missing price entries that were imputed.
      key: missing_values_count
      type: int
    - description: Indicates whether the price series was normalized to a 0-1 range.
      key: is_normalized
      type: bool
    prd:
      conceptual_info: The `preprocess_price_data` node transforms raw historical
        price data into a clean, consistent, and analysis‑ready format. It fills gaps,
        scales the series for comparability across assets, and records key metadata
        such as how many values were imputed and whether normalization was applied.
        This processed output feeds statistical analysis and trend‑identification
        steps downstream.
      docstring:
        examples:
        - lines:
          - '# Example 1: Simple preprocessing with no missing values'
          - output = preprocess_price_data(
          - '    dates=[''2023-01-01'', ''2023-01-02''],'
          - '    prices_btc=[20000.0, 21000.0],'
          - '    prices_eth=[1200.0, 1250.0],'
          - '    prices_stable=[1.0, 1.0]'
          - )
          - print(output)
          output: '{''dates'': [''2023-01-01'', ''2023-01-02''], ''prices'': [20000.0,
            21000.0], ''missing_values_count'': 0, ''is_normalized'': False}'
        - lines:
          - '# Example 2: Handling missing values and normalizing'
          - output = preprocess_price_data(
          - '    dates=[''2023-01-01'', ''2023-01-02'', ''2023-01-03''],'
          - '    prices_btc=[20000.0, None, 21000.0],'
          - '    prices_eth=[1200.0, 1250.0, None],'
          - '    prices_stable=[1.0, 1.0, 1.0]'
          - )
          - print(output)
          output: '{''dates'': [''2023-01-01'', ''2023-01-02'', ''2023-01-03''], ''prices'':
            [20000.0, 20000.0, 21000.0], ''missing_values_count'': 2, ''is_normalized'':
            True}'
        parameters:
        - description: List of ISO‑formatted dates (YYYY-MM-DD) for which price data
            was retrieved.
          name: dates
          type: List[str]
        - description: List of closing prices for BTC aligned with the dates list.
          name: prices_btc
          type: List[float]
        - description: List of closing prices for ETH aligned with the dates list.
          name: prices_eth
          type: List[float]
        - description: List of closing prices for the chosen stablecoin (e.g., USDT)
            aligned with the dates list.
          name: prices_stable
          type: List[float]
        raises:
        - description: If the input price lists are of unequal length or contain non‑numeric
            entries.
          type: ValueError
        - description: If any input parameter is not of the expected type.
          type: TypeError
        returns:
          description: A dictionary containing the cleaned and transformed price series,
            including dates, a unified price list, the count of imputed values, and
            a flag indicating whether normalization was performed.
          type: Dict[str, Any]
        summary: Preprocesses raw historical price data for downstream analysis.
    prompt: Preprocess the historical price data by handling missing values, data
      normalization, and feature scaling.
  preprocess_volume_data:
    agent: false
    description: Clean and transform volume data for analysis by removing missing
      entries, normalizing volumes to a common scale, and preparing the dataset for
      downstream statistical analysis.
    name: preprocess_volume_data
    nodes_depended_on:
    - download_historical_volumes
    nodes_dependent_on: []
    output_structure:
    - description: List of dates corresponding to each volume entry.
      key: dates
      type: List[str]
    - description: Original volume values after missing value handling.
      key: raw_volumes
      type: List[float]
    - description: Volume values scaled to a 0-1 range or standardized to mean 0 and
        std 1.
      key: normalized_volumes
      type: List[float]
    - description: Number of missing volume entries that were imputed or removed.
      key: missing_value_count
      type: int
    - description: Indicates whether the preprocessing produced a dataset suitable
        for analysis.
      key: is_valid
      type: bool
    prd:
      conceptual_info: This node takes raw historical volume data for BTC, stablecoins,
        and ETH, cleans it by handling missing entries, and normalizes the volumes
        to a uniform scale. The resulting dataset is ready for statistical trend analysis
        and further trading strategy development.
      docstring:
        examples:
        - lines:
          - result = preprocess_volume_data(
          - '    btc_dates=[''2023-01-01'', ''2023-01-02''],'
          - '    btc_volumes=[1000.0, 1100.0],'
          - '    stablecoin_dates=[''2023-01-01'', ''2023-01-02''],'
          - '    stablecoin_volumes=[2000.0, 2100.0],'
          - '    eth_dates=[''2023-01-01'', ''2023-01-02''],'
          - '    eth_volumes=[1500.0, 1600.0],'
          - '    normalization_method=''minmax'')'
          output: '{''dates'': [''2023-01-01'', ''2023-01-02''], ''raw_volumes'':
            [1000.0, 1100.0, 2000.0, 2100.0, 1500.0, 1600.0], ''normalized_volumes'':
            [0.0, 0.1, 0.7, 0.8, 0.4, 0.5], ''missing_value_count'': 0, ''is_valid'':
            True}'
        - lines:
          - result = preprocess_volume_data(
          - '    btc_dates=[''2023-01-01'', None],'
          - '    btc_volumes=[1000.0, None],'
          - '    stablecoin_dates=[''2023-01-01''],'
          - '    stablecoin_volumes=[2000.0],'
          - '    eth_dates=[''2023-01-01''],'
          - '    eth_volumes=[1500.0],'
          - '    normalization_method=''standard'')'
          output: '{''dates'': [''2023-01-01''], ''raw_volumes'': [1000.0, 2000.0,
            1500.0], ''normalized_volumes'': [-1.0, 1.0, 0.0], ''missing_value_count'':
            2, ''is_valid'': True}'
        parameters:
        - description: ISO 8601 formatted dates for BTC volume records.
          name: btc_dates
          type: List[str]
        - description: Daily trading volumes for BTC aligned with btc_dates.
          name: btc_volumes
          type: List[float]
        - description: ISO 8601 formatted dates for stablecoin volume records.
          name: stablecoin_dates
          type: List[str]
        - description: Daily trading volumes for stablecoins aligned with stablecoin_dates.
          name: stablecoin_volumes
          type: List[float]
        - description: ISO 8601 formatted dates for ETH volume records.
          name: eth_dates
          type: List[str]
        - description: Daily trading volumes for ETH aligned with eth_dates.
          name: eth_volumes
          type: List[float]
        - description: 'Method used for scaling volumes: ''minmax'' for 0-1 scaling
            or ''standard'' for mean‑zero/std‑one standardization.'
          name: normalization_method
          type: str
        raises:
        - description: If any of the date lists are empty or lengths of dates and
            volumes do not match.
          type: ValueError
        - description: If volume inputs contain non‑numeric values.
          type: TypeError
        returns:
          description: A dictionary containing cleaned dates, raw volumes, normalized
            volumes, missing value count, and a validity flag.
          type: Dict[str, Any]
        summary: Preprocesses historical cryptocurrency volume data by handling missing
          values and normalizing the series.
    prompt: Preprocess the historical volume data by handling missing values, data
      normalization, and feature scaling.
  validate_strategy:
    agent: false
    description: Validate the trading strategy's feasibility by evaluating key performance
      and risk metrics from backtesting and hedging outputs.
    name: validate_strategy
    nodes_depended_on:
    - backtest_strategy
    - hedge_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Whether the strategy meets predefined viability thresholds.
      key: is_valid
      type: bool
    - description: Compound Annual Growth Rate of the strategy.
      key: cagr
      type: float
    - description: Sharpe Ratio indicating risk-adjusted return.
      key: sharpe_ratio
      type: float
    - description: Maximum observed drawdown percentage.
      key: max_drawdown
      type: float
    - description: Total net profit in USD after hedging.
      key: net_profit
      type: float
    - description: Total number of trades executed.
      key: total_trades
      type: int
    prd:
      conceptual_info: Validates a trading strategy's feasibility by aggregating performance
        metrics from backtesting and hedging results, determining if the strategy
        meets predefined viability thresholds.
      docstring:
        examples:
        - lines:
          - backtest_result = {
          - '    ''cagr'': 0.12,'
          - '    ''sharpe_ratio'': 1.5,'
          - '    ''max_drawdown'': 0.20,'
          - '    ''net_profit'': 48000.0,'
          - '    ''total_trades'': 150'
          - '}'
          - hedge_result = {
          - '    ''hedging_ratio'': 0.30,'
          - '    ''entry_conditions'': ''price > 0.01'','
          - '    ''exit_conditions'': ''price < 0.009'','
          - '    ''crypto_exposure'': 100000.0,'
          - '    ''tether_position'': 30000.0,'
          - '    ''strategy_summary'': ''Tether hedge to limit crypto exposure.'''
          - '}'
          - validate_strategy(backtest_result, hedge_result)
          output: "{\n  'is_valid': True,\n  'cagr': 0.12,\n  'sharpe_ratio': 1.5,\n\
            \  'max_drawdown': 0.20,\n  'net_profit': 48000.0,\n  'total_trades':\
            \ 150\n}"
        - lines:
          - backtest_result = {
          - '    ''cagr'': 0.05,'
          - '    ''sharpe_ratio'': 0.8,'
          - '    ''max_drawdown'': 0.35,'
          - '    ''net_profit'': -12000.0,'
          - '    ''total_trades'': 80'
          - '}'
          - hedge_result = {
          - '    ''hedging_ratio'': 0.20,'
          - '    ''entry_conditions'': ''price > 0.02'','
          - '    ''exit_conditions'': ''price < 0.018'','
          - '    ''crypto_exposure'': 50000.0,'
          - '    ''tether_position'': 10000.0,'
          - '    ''strategy_summary'': ''Limited hedge due to high drawdown.'''
          - '}'
          - validate_strategy(backtest_result, hedge_result)
          output: "{\n  'is_valid': False,\n  'cagr': 0.05,\n  'sharpe_ratio': 0.8,\n\
            \  'max_drawdown': 0.35,\n  'net_profit': -12000.0,\n  'total_trades':\
            \ 80\n}"
        parameters:
        - description: Dictionary output from backtest_strategy containing performance
            metrics such as cagr, sharpe_ratio, max_drawdown, net_profit, and total_trades.
          name: backtest_result
          type: dict
        - description: Dictionary from hedge_strategy containing hedging metrics such
            as hedging_ratio, entry_conditions, exit_conditions, crypto_exposure,
            tether_position, and strategy_summary.
          name: hedge_result
          type: dict
        raises:
        - description: Raised if required metrics are missing or of incorrect type
            in either input dictionary.
          type: ValueError
        returns:
          description: Dictionary with keys is_valid, cagr, sharpe_ratio, max_drawdown,
            net_profit, total_trades matching the output_structure.
          type: dict
        summary: Validates the trading strategy by analyzing performance statistics,
          risk metrics, and profit/loss projections from backtest and hedge outputs.
    prompt: Validate the trading strategy by analyzing performance statistics, risk
      metrics, and profit/loss projections. Determine the viability of the trading
      strategy.
